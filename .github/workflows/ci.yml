name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Clone pinned sibling a3
        run: git clone --depth 1 --branch closeout-v1.0 https://github.com/valeriobitzone-png/a3.git "$GITHUB_WORKSPACE/../a3"
      - run: python3 -m pip install pytest
      - run: python3 -m pytest -q
